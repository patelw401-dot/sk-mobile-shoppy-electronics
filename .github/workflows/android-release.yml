name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach the APK to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON Actions secret is required"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Validate production Firebase app configuration
        run: |
          python3 - <<'PY'
          import json

          expected_project = "gen-lang-client-0232823199"
          expected_package = "com.aistudio.skmobile.udgirs"
          expected_web_client_id = "23597341071-4f8sr6sum748fcm30eba02332i2n3isr.apps.googleusercontent.com"
          with open("app/google-services.json", encoding="utf-8") as config_file:
              config = json.load(config_file)

          if config.get("project_info", {}).get("project_id") != expected_project:
              raise SystemExit("GOOGLE_SERVICES_JSON is not the existing production Firebase project")

          app_client = next(
              (
                  client
                  for client in config.get("client", [])
                  if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
                  == expected_package
              ),
              None,
          )
          if app_client is None:
              raise SystemExit(f"GOOGLE_SERVICES_JSON has no Android app for {expected_package}")

          if not any(
              oauth_client.get("client_type") == 3
              and oauth_client.get("client_id") == expected_web_client_id
              for oauth_client in app_client.get("oauth_client", [])
          ):
              raise SystemExit("GOOGLE_SERVICES_JSON has no expected production Google Web OAuth client")
          PY

      - name: Build debug APK and process both Firebase variants
        run: |
          gradle :app:processDebugGoogleServices :app:processReleaseGoogleServices :app:assembleDebug
          for variant in debug release; do
            resources="app/build/generated/res/process${variant^}GoogleServices/values/values.xml"
            grep -Fq '<string name="project_id" translatable="false">gen-lang-client-0232823199</string>' "$resources"
            grep -Fq '<string name="default_web_client_id" translatable="false">23597341071-4f8sr6sum748fcm30eba02332i2n3isr.apps.googleusercontent.com</string>' "$resources"
          done

      - name: Prepare release asset
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sk-mobile-shoppy.apk
          test -s dist/sk-mobile-shoppy.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/sk-mobile-shoppy.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
