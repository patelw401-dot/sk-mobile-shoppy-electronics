name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach the APK to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Provide CI fallback for missing OAuth resource
        run: |
          if [ ! -f app/google-services.json ]; then
            mkdir -p app/src/debug/res/values
            printf '%s\n' \
              '<resources>' \
              '  <string name="default_web_client_id" translatable="false">23597341071-4f8sr6sum748fcm30eba02332i2n3isr.apps.googleusercontent.com</string>' \
              '</resources>' > app/src/debug/res/values/ci-google-oauth.xml
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Prepare release asset
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sk-mobile-shoppy.apk
          test -s dist/sk-mobile-shoppy.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/sk-mobile-shoppy.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
