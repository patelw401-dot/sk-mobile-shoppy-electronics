name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach the APK to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Restore persistent APK signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EXPECTED_ANDROID_SIGNING_SHA1: 74:4C:A0:C0:DC:20:2E:56:5F:9A:B9:F2:54:81:BF:9C:86:A7:51:57
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ] || [ -z "$ANDROID_SIGNING_STORE_PASSWORD" ] || [ -z "$ANDROID_SIGNING_KEY_ALIAS" ] || [ -z "$ANDROID_SIGNING_KEY_PASSWORD" ]; then
            echo "Android signing secrets are not fully configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          actual_sha1="$(keytool -list -v -keystore debug.keystore -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_sha1="$(printf '%s' "$EXPECTED_ANDROID_SIGNING_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_sha1" != "$expected_sha1" ]; then
            echo "Configured signing keystore SHA-1 does not match the expected release certificate" >&2
            exit 1
          fi
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON Actions secret is required"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Validate production Firebase app configuration
        run: |
          python3 - <<'PY'
          import json

          expected_project = "gen-lang-client-0232823199"
          expected_package = "com.aistudio.skmobile.udgirs"
          expected_web_client_id = "23597341071-4f8sr6sum748fcm30eba02332i2n3isr.apps.googleusercontent.com"
          with open("app/google-services.json", encoding="utf-8") as config_file:
              config = json.load(config_file)

          if config.get("project_info", {}).get("project_id") != expected_project:
              raise SystemExit("GOOGLE_SERVICES_JSON is not the existing production Firebase project")

          app_client = next(
              (
                  client
                  for client in config.get("client", [])
                  if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
                  == expected_package
              ),
              None,
          )
          if app_client is None:
              raise SystemExit(f"GOOGLE_SERVICES_JSON has no Android app for {expected_package}")

          if not any(
              oauth_client.get("client_type") == 3
              and oauth_client.get("client_id") == expected_web_client_id
              for oauth_client in app_client.get("oauth_client", [])
          ):
              raise SystemExit("GOOGLE_SERVICES_JSON has no expected production Google Web OAuth client")
          PY

      - name: Build debug and release APKs and process Firebase variants
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          gradle :app:processDebugGoogleServices :app:processReleaseGoogleServices :app:assembleDebug :app:assembleRelease
          for variant in debug release; do
            resources="app/build/generated/res/process${variant^}GoogleServices/values/values.xml"
            grep -Fq '<string name="project_id" translatable="false">gen-lang-client-0232823199</string>' "$resources"
            grep -Fq '<string name="default_web_client_id" translatable="false">23597341071-4f8sr6sum748fcm30eba02332i2n3isr.apps.googleusercontent.com</string>' "$resources"
          done

      - name: Prepare release asset
        env:
          EXPECTED_ANDROID_SIGNING_SHA1: 74:4C:A0:C0:DC:20:2E:56:5F:9A:B9:F2:54:81:BF:9C:86:A7:51:57
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/sk-mobile-shoppy.apk
          test -s dist/sk-mobile-shoppy.apk
          apk_sha1="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/sk-mobile-shoppy.apk | awk -F': ' '/certificate SHA-1 digest:/{print $NF; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_sha1="$(printf '%s' "$EXPECTED_ANDROID_SIGNING_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$apk_sha1" != "$expected_sha1" ]; then
            echo "Release APK signing SHA-1 does not match the configured release certificate" >&2
            exit 1
          fi
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/sk-mobile-shoppy.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
