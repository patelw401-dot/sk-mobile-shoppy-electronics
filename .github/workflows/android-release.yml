name: Android Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'web/public/sk-mobile-release.apk'
      - 'web/public/app-version.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build-release:
    needs: verify
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(apk):')

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '9.3.1'

      - name: Decode & Verify Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Secret ANDROID_SIGNING_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD}" ]; then
            echo "::error::Secret ANDROID_SIGNING_STORE_PASSWORD is missing or empty."
            exit 1
          fi
          if [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::Secret ANDROID_SIGNING_KEY_PASSWORD is missing or empty."
            exit 1
          fi

          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > "${KEYSTORE_FILE}"

          if ! keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${STORE_PASSWORD}" >/dev/null 2>&1; then
            echo "::error::Failed to open keystore. Either ANDROID_SIGNING_STORE_PASSWORD is wrong or ANDROID_SIGNING_KEYSTORE_BASE64 is corrupted."
            exit 1
          fi

          TARGET_ALIAS="${KEY_ALIAS:-upload}"
          if ! keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${STORE_PASSWORD}" -alias "${TARGET_ALIAS}" >/dev/null 2>&1; then
            echo "::error::Alias '${TARGET_ALIAS}' (ANDROID_SIGNING_KEY_ALIAS) was not found in the keystore."
            echo "Available aliases in keystore:"
            keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${STORE_PASSWORD}" | grep -E "Alias name:|, " || true
            exit 1
          fi

          # app/build.gradle.kts hardcodes keyAlias = "upload" in signingConfigs.release.
          # If the keystore uses a different alias, remap it in the temporary CI keystore copy.
          if [ "${TARGET_ALIAS}" != "upload" ]; then
            echo "Remapping keystore alias '${TARGET_ALIAS}' -> 'upload' for Gradle signingConfigs.release..."
            keytool -changealias \
              -keystore "${KEYSTORE_FILE}" \
              -storepass "${STORE_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -alias "${TARGET_ALIAS}" \
              -destalias "upload"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"

      - name: Restore app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_RAW}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is missing or empty."
            exit 1
          fi

          TRIMMED="$(printf '%s' "${GOOGLE_SERVICES_JSON_RAW}" | sed -e 's/^[[:space:]]*//')"
          if [[ "${TRIMMED}" == \{* ]]; then
            printf '%s\n' "${GOOGLE_SERVICES_JSON_RAW}" > app/google-services.json
          else
            if ! printf '%s' "${GOOGLE_SERVICES_JSON_RAW}" | tr -d '\r\n ' | base64 --decode > app/google-services.json; then
              echo "::error::Failed to Base64-decode GOOGLE_SERVICES_JSON."
              exit 1
            fi
          fi

          if [ ! -s app/google-services.json ] || ! python3 -c "import json; json.load(open('app/google-services.json'))" >/dev/null 2>&1; then
            echo "::error::Restored app/google-services.json is empty or invalid JSON."
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sk-mobile-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Clean up temporary keystores
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks" "${{ github.workspace }}/debug.keystore"

  publish:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sk-mobile-release-apk
          path: release-artifact
      - name: Publish versioned APK and update website metadata
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK_FILE="$(find release-artifact -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "${APK_FILE}" ] || [ ! -f "${APK_FILE}" ]; then
            echo "::error::No signed release APK found in app/build/outputs/apk/release/"
            exit 1
          fi

          mkdir -p web/public
          mv "$APK_FILE" release-artifact/sk-mobile-release.apk
          TAG="v$APP_VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifact/sk-mobile-release.apk --clobber
          else
            gh release create "$TAG" release-artifact/sk-mobile-release.apk --target "$GITHUB_SHA" --title "$TAG" --notes "Signed Android release."
          fi

          python3 - <<'PY'
          import json
          import os

          version_code = int(os.environ["APP_VERSION_CODE"])
          version_name = os.environ["APP_VERSION_NAME"]
          payload = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkPath": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version_name}/sk-mobile-release.apk",
              "releaseNotes": "New features and improvements are available."
          }
          with open("web/public/app-version.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/app-version.json

          if git diff --cached --quiet; then
            echo "Website release APK and app-version.json are unchanged. Skipping commit."
            exit 0
          fi

          git commit -m "chore(apk): update website release APK (v${APP_VERSION_NAME})"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase --autostash origin/main
            git push origin HEAD:main
          fi
