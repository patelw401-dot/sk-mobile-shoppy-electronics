name: Verify storefront and Firebase

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm audit --prefix web --audit-level=high
      - run: npm ci
      - run: npm ci --prefix functions
      - run: node --check functions/index.js
      - run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-no-project 'npm test && node --test functions/orders.test.js'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '9.3.1'
      - name: Use test-only Firebase configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "1234567890", "project_id": "demo-no-project"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                "android_client_info": {"package_name": "com.aistudio.skmobile.udgirs"}
              },
              "api_key": [{"current_key": "test-only"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - run: ./gradlew :app:testDebugUnitTest --no-daemon
