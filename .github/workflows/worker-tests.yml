name: Worker tests
on:
  push:
    branches: [feature/cloudflare-backend]
  pull_request:
    paths: ['worker/**', 'wrangler.toml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix worker
  full-project:
    uses: ./.github/workflows/verify.yml
